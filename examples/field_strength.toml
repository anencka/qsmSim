# 3 T against 7 T with the same echo train. Noise is defined against the 3 T white-matter signal and 7 T gets an
# SNR gain (edit gain; Experiment 2 used 1, 2 and 3.1). R2* and the vein phase scale with the field.
# Resources as echo_trains.toml (two phantom preparations, one per field).
name = "field_strength"
base = "explore"
phantoms = ["P1"]
b0_tesla = [3.0, 7.0]
resolution_mm = [1.0]
snr = [5, 20, 100]
replicates = 2
protocols = [ { dte_ms = 5.4, echoes = 5 }, { dte_ms = 2.4, echoes = 11 } ]
backgrounds = ["oracle"]
inversions = ["medi"]
lambda = { medi = [3e-6, 1e-5, 3e-5, 1e-4, 3e-4, 1e-3] }
select = ["vein_auc", "rmse"]

[noise]
reference_b0 = 3.0
gain = { "7" = 2.0 }
