[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qsmsim"
version = "0.2.0"
description = "Numerical QSM simulation: sub-voxel vein phantoms, multi-echo GRE forward model, reconstruction and scoring"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrew S. Nencka" }]
requires-python = ">=3.11"
keywords = ["MRI", "QSM", "quantitative susceptibility mapping", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "nibabel>=5.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# GPU backend (QSMSIM_BACKEND=gpu): CuPy with the CUDA libraries as pip wheels; only the NVIDIA driver is needed.
# Pick the one matching your driver (nvidia-smi: "CUDA Version"). Tested: CuPy 14.2 on CUDA 13.2.
gpu-cuda13 = ["cupy-cuda13x[ctk]>=14.0"]
gpu-cuda12 = ["cupy-cuda12x[ctk]>=14.0"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/anencka/qsmSim"

[project.scripts]
qsmsim = "qsmsim.__main__:main"
qsmsim-exp = "qsmsim.exp1.__main__:main"
qsmsim-explore = "qsmsim.explore:main"
qsmsim-fetch-rc2 = "qsmsim.rc2_download:main"

[tool.setuptools.packages.find]
include = ["qsmsim*"]

[tool.setuptools.package-data]
"qsmsim.exp1" = ["*.json"]
